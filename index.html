<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>BYTITUDE | Earn certifications with Practical Skills</title>
    <meta name="description" content="Tim Collins' Own Your Home is a proven two-phase behavioral finance program guiding families, couples, and first-time buyers from financial instability to lasting homeownership." />
    <meta name="keywords" content="homeownership, behavioral finance, financial education, own your home, Tim Collins, mortgage readiness, first time home buyer, debt elimination, financial stability, Omaha Nebraska" />
    <meta name="author" content="Tim Collins" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://ownyourhome.com/" />
    <meta name="theme-color" content="#C9A84C" />

    <!-- Open Graph -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://tcownyourhome.com/" />
    <meta property="og:title"        content="Own Your Home | Tim Collins — Behavioral Finance Program" />
    <meta property="og:description"  content="A proven two-phase framework combining behavioral finance and financial literacy to guide you from instability to homeownership." />
    <meta property="og:image"        content="https://ownyourhome.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"    content="Own Your Home" />
    <meta property="og:locale"       content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@ownyourhome" />
    <meta name="twitter:creator"     content="@timcollins" />
    <meta name="twitter:title"       content="Own Your Home | Tim Collins" />
    <meta name="twitter:description" content="Proven behavioral finance program for aspiring homeowners." />
    <meta name="twitter:image"       content="https://ownyourhome.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon"              type="image/svg+xml" href="/favicon.png" />
    <link rel="icon"              type="image/png"     href="/favicon.png" />
    <link rel="apple-touch-icon"                       href="/apple-touch-icon.png" />
    <link rel="manifest"                               href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Lato:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Own Your Home",
      "alternateName": "Tim Collins Own Your Home",
      "description": "Behavioral finance education program guiding aspiring homeowners from financial instability to homeownership.",
      "url": "https://ownyourhome.com",
      "logo": "https://ownyourhome.com/logo.png",
      "founder": { "@type": "Person", "name": "Tim Collins", "jobTitle": "Behavioral Finance Educator" },
      "address": { "@type": "PostalAddress", "addressLocality": "Omaha", "addressRegion": "NE", "addressCountry": "US" },
      "sameAs": ["https://twitter.com/ownyourhome", "https://instagram.com/ownyourhome", "https://facebook.com/ownyourhome"]
    }
    </script>

    <!-- JSON-LD: Course -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Own Your Home — Behavioral Finance Program",
      "description": "A two-phase behavioral finance program taking aspiring homeowners from financial instability to closing day.",
      "provider": { "@type": "Person", "name": "Tim Collins", "sameAs": "https://ownyourhome.com/about" },
      "url": "https://ownyourhome.com/own-your-home",
      "inLanguage": "en",
      "offers": { "@type": "Offer", "category": "Workshop", "url": "https://ownyourhome.com/workshops" }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Own Your Home",
      "url": "https://ownyourhome.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ownyourhome.com/resources?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
